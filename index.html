<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Projects Dashboard View</title>
    <link href="./style.css" rel="stylesheet" type="text/css">
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="search-actions-area">
          <button class="search-icon">&#10102;</button>
          <input type="text" name="search" value="" class="search-input">
        </div>
        <div class="user-actions-area">
          <button class="bell-icon">&#10102;</button>
          <img src="./images/profile-2.png" alt="profile picture" class="header-profile-avatar">
          <span class="user-name-text">Joe Nzima</span>
        </div>
        <div class="user-details-area">
          <img src="./images/profile-2.png" alt="profile picture" class="header-profile-avatar">
          <p class="user-greeting-text">Hi there,</p>
          <span class="user-name-text">Joe Nzima</span>
        </div>
        <div class="project-actions-area">
          <button class="project-new-btn">New</button>
          <button class="project-upload-btn">Upload</button>
          <button class="project-share-btn">Share</button>
        </div>
      </div>
      <div class="sidebar">
        <div class="branding">
          <a href="#dashboard" class="dashboard-logo"><span>&#10102;</span>Dashboard</a>
        </div>
        <div class="navigation">
          <div class="nav-main">
            <ul class="menu">
              <li><a href="#home"><span>&#10102;</span>Home</a></li>
              <li><a href="#profile"><span>&#10102;</span>Profile</a></li>
              <li><a href="#messages"><span>&#10102;</span>Messages</a></li>
              <li><a href="#history"><span>&#10102;</span>History</a></li>
              <li><a href="#tasks"><span>&#10102;</span>Tasks</a></li>
              <li><a href="#communities"><span>&#10102;</span>Communities</a></li>
            </ul>
          </div>
          <div class="nav-extas">
            <ul class="menu">
              <li><a href="#settings"><span>&#10102;</span>Settings</a></li>
              <li><a href="#support"><span>&#10102;</span>Support</a></li>
              <li><a href="#privacy"><span>&#10102;</span>Privacy</a></li>
            </ul>
          </div>
        </div>
      </div>
      <div class="main-content"></div>
    </div>
  </body>
</html>
